<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온톨로지 탐색</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--acc:#0969da;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--acc:#58a6ff;--chip:#21262d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:20px 0 6px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}input{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
a{color:var(--acc);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.row{padding:8px 0;border-bottom:1px solid var(--line)}.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:0 8px;margin:2px 4px 2px 0;font-size:12px;color:var(--mut)}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px}.mut{color:var(--mut);font-size:13px}code{background:var(--chip);padding:1px 5px;border-radius:4px}
.tabs a{margin-right:12px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>온톨로지 탐색</h1>
<div class="sub" id="stats">불러오는 중…</div>
<input id="q" type="search" placeholder="화면번호(6106), 항목명(현재가), 항목코드(14501), 함수(CT), TR 후보(8003)">
<div class="tabs" style="margin-top:8px"><a href="#">처음</a><a href="#gaps">못 찾은 화면 요구</a></div>
<div id="out"></div>
<p class="mut">자동 추출한 연결은 검수 전입니다. 사례는 본문 없이 의도·영역과 위키 링크만 보여 줍니다.</p>
</main>
<script>
let D=null;
const $=s=>document.querySelector(s), out=$('#out');
const INTENT={screen_finding:'화면 찾기',data_availability:'데이터 제공 여부',data_error:'수치 오류·정정',env_setup:'설치·환경',hardware_support:'단말·하드웨어',admin_contract:'일정·계약·요금',feedback:'의견·개선 제안',account_access:'계정·권한',howto:'사용법',empty:'내용 미기재',other:'기타'};
const KIND={price:'가격',qty:'수량',ratio:'비율',amount:'금액',index:'지수',date:'날짜·시각',enum:'구분값',unknown:'미상'};
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='text')e.textContent=v;else e.setAttribute(k,v)}for(const c of kids)if(c)e.append(c);return e}
const link=(hash,text)=>h('a',{href:'#'+hash,text});
const chip=t=>h('span',{class:'chip',text:t});
function caseRow(c){const d=h('div',{class:'row'});d.append(h('a',{href:c.p,text:'사례 '+c.h}),chip(INTENT[c.i]||'미분류'),...c.d.map(chip));return d}
function section(title,nodes){const s=h('div',{class:'box'},h('h2',{text:title,style:'margin-top:0'}));nodes.forEach(n=>s.append(n));if(!nodes.length)s.append(h('div',{class:'mut',text:'없음'}));return s}
function itemLine(code){const it=D.items[code];const d=h('div',{class:'row'});d.append(link('item/'+code,it.n),h('span',{class:'mut',text:' '+code+' · '}),chip(KIND[it.k]),...it.f.map(f=>chip(f)));return d}
function show(hash){out.replaceChildren();const[t,k]=(hash||'').replace('#','').split('/').map(decodeURIComponent);
 if(t==='gaps'){out.append(...D.gaps.map(g=>section(g.label+' ('+g.ca.length+'건)',g.ca.map(i=>caseRow(D.cases[i])))));if(!D.gaps.length)out.append(h('p',{text:'없음'}));return}
 if(t==='item'&&D.items[k]){const it=D.items[k];out.append(h('h2',{text:it.n+' ('+k+')'}),h('div',{class:'mut',text:'값 종류: '+KIND[it.k]+' (자동 추정) · 시장: '+it.m.join(', ')}),
  section('엑셀 함수로 가져오기',it.f.map(f=>{const r=h('div',{class:'row'});r.append(link('func/'+f,f),h('span',{class:'mut',text:' '+(D.funcs[f]?.sig||'')}));return r})),
  section('이 항목을 언급·제공하는 화면',[...new Set(it.s)].map(tr=>{const s=D.screens[tr];const r=h('div',{class:'row'});r.append(link('screen/'+tr,tr+' '+s.t));return r})));return}
 if(t==='screen'&&D.screens[k]){const s=D.screens[k];out.append(h('h2',{text:k+' '+s.t}),h('div',{},h('a',{href:s.p,text:'위키 문서 열기'})),
  section('연결된 항목 ('+s.it.length+')',s.it.slice(0,60).map(([c,r])=>{const d=itemLine(c);d.append(chip(r==='P'?'소제목 일치':'본문 언급'));return d})),
  section('이 화면을 다룬 문의 사례 ('+s.ca.length+')',s.ca.slice(0,40).map(i=>caseRow(D.cases[i]))));return}
 if(t==='func'&&D.funcs[k]){const f=D.funcs[k];out.append(h('h2',{text:k}),h('div',{},h('code',{text:f.sig||''})),h('p',{text:f.scope||'매뉴얼에 없고 사례에서만 언급됨'}),
  section('이 함수로 가져오는 항목 (최대 60)',Object.keys(D.items).filter(c=>D.items[c].f.includes(k)).slice(0,60).map(itemLine)),
  section('이 함수를 쓴 문의 사례',D.cases.filter(c=>c.f.includes(k)).slice(0,40).map(caseRow)));return}
 if(t==='tr'&&D.tr[k]){const r=D.tr[k];out.append(h('h2',{text:'TR '+k+' (화면 문서 없음)'}),h('div',{class:'mut',text:'언급 사례 '+r.mentions+'건'+(r.fp?' · 연도·금액 오탐 가능성':'')+' · 앱에서 화면이 열리는지 확인 전'}),section('언급한 사례',r.ca.map(i=>caseRow(D.cases[i]))));return}
 out.append(h('p',{class:'mut',text:'검색어를 입력하거나 위 입력창에 화면번호·항목명·함수를 넣으세요. 예: 현재가, 6106, CT, 8003'}))}
function search(q){q=q.trim().toLowerCase();if(!q){show(location.hash);return}out.replaceChildren();const rows=[];
 for(const[tr,s]of Object.entries(D.screens))if(tr.startsWith(q)||s.t.toLowerCase().includes(q))rows.push(['screen/'+tr,'화면 '+tr+' '+s.t]);
 for(const f of Object.keys(D.funcs))if(f.toLowerCase()===q)rows.push(['func/'+f,'함수 '+f]);
 for(const tr of Object.keys(D.tr))if(tr===q)rows.push(['tr/'+tr,'TR 후보 '+tr+' (화면 문서 없음)']);
 let n=0;for(const[c,it]of Object.entries(D.items)){if(c===q||it.n.toLowerCase().includes(q)){rows.push(['item/'+c,'항목 '+it.n+' ('+c+')']);if(++n>=40)break}}
 if(!rows.length)out.append(h('p',{text:'결과 없음'}));rows.slice(0,80).forEach(([hs,t])=>out.append(h('div',{class:'row'},link(hs,t))))}
fetch('data.json').then(r=>r.json()).then(d=>{D=d;const s=d.stats;$('#stats').textContent=`항목 ${s.items.toLocaleString()} · 화면 ${s.screens} · 함수 ${s.funcs} · 문의 사례 ${s.cases.toLocaleString()} · TR 후보 ${s.tr_candidates}`;show(location.hash)}).catch(()=>{$('#stats').textContent='data.json 을 불러오지 못했습니다'});
$('#q').addEventListener('input',e=>D&&search(e.target.value));
addEventListener('hashchange',()=>{if(D){$('#q').value='';show(location.hash)}});
</script>
</body>
</html>
