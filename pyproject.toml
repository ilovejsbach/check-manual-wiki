[project]
name = "check-expert-wiki-tools"
version = "0.1.0"
description = "Reproducible source extraction tools for the CHECK Expert Quartz wiki"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "pypdf>=6.1.3",
  "python-calamine>=0.6.1",
  "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
  "pyyaml>=6.0.3",
  "pytest>=8.4.2",
  "ruff>=0.14.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
